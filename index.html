<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Procvičování</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--ac:#2f5d8a;--ok:#2e7d4f;--bad:#b3392f;--bd:#ddd9cf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#171716;--card:#222220;--tx:#eceae3;--mu:#9a988f;--ac:#7fb0e0;--ok:#6fc28d;--bad:#e5877e;--bd:#37352f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.6rem;margin:0 0 4px}
h2{margin:12px 0}
.sub,.mu{color:var(--mu)}
.sub{margin:0 0 20px}
.mu{font-size:.9rem}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 14px}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button:disabled{opacity:.6;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{padding:22px 10px;text-align:center;border-radius:12px;font-size:1.05rem}
.tile span{display:block;font-size:1.8rem;margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,transparent)}
.txt{display:block;width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin:6px 0 10px}
.txt:focus{outline:2px solid var(--ac);outline-offset:0}
.txt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.txt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,transparent)}
.res{margin:0 0 10px}
.res.ok{color:var(--ok)}
.res.bad{color:var(--bad)}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:8px 0 16px}
.bar>div{height:100%;background:var(--ac)}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tabs{display:flex;gap:8px;margin:14px 0}
.tabs button{flex:1;padding:10px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.th{padding:0;overflow:hidden;text-align:left}
.th img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--bd)}
.th span{display:block;padding:6px 8px;font-size:.85rem}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;flex-direction:column;
padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);color:#eee}
.lbm{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:56px 12px 8px}
.lbm img{max-width:100%;max-height:100%;object-fit:contain}
.lbc{text-align:center;padding:8px 16px 14px}
.lbc a{color:#9cc4ec}
.lb button{position:absolute;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:50%;width:44px;height:44px;padding:0;font-size:1.4rem}
.lbx{top:calc(env(safe-area-inset-top,0px) + 8px);right:10px}
.lbp,.lbn{top:50%;transform:translateY(-50%)}
.lbp{left:8px}.lbn{right:8px}
.err{color:var(--bad);font-size:.85rem}
</style>
</head>
<body>
<main>
  <h1>Cvičení</h1>
  <p class="sub">Vyber předmět.</p>
  <div id="view"></div>
</main>
<script>
const SUBJECTS=[['matematika','Matematika','🔢'],['cestina','Čeština','📖'],['prirodopis','Přírodopis','🌿'],['fyzika','Fyzika','⚡'],['chemie','Chemie','🧪'],['dejepis','Dějepis','🏛️'],['zemepis','Zeměpis','🌍'],['anglictina','Angličtina','🇬🇧']];

// Repozitář s materiály. Nechej prázdné: zjistí se automaticky z adresy *.github.io.
// Jen když stránka běží jinde (vlastní doména), vyplň např. {owner:'jmeno',repo:'nazev-repa',branch:'main'}
const GH={owner:'',repo:'',branch:''};
const IMG=/\.(jpe?g|png|gif|webp|svg|avif)$/i;

// U otevřených odpovědí: true = háčky a čárky se při kontrole ignorují (byt = být)
const IGNORE_DIACRITICS=false;

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=null, data=null, run=null, tab='tests', topic=null;

// Porovnání otevřených odpovědí: ignoruje velikost písmen, mezery navíc a interpunkci
function norm(s){
  s=String(s).toLowerCase();
  if(IGNORE_DIACRITICS)s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return s.replace(/[^\p{L}\p{N}]+/gu,' ').trim();
}

function parse(txt){
  const tests=[],errors=[];let t=null,q=null;
  const closeQ=()=>{if(!q)return;
    const title='Test „'+t.title+'“, otázka „'+q.q+'“: ';
    if(q.answers.length||q.strict.length){
      if(q.options.length)errors.push(title+'nemůže mít zároveň možnosti (+/-) a odpovědi (= / ==).');
      else if(q.answers.length&&q.strict.length)errors.push(title+'nelze míchat „=“ a „==“ v jedné otázce.');
      else t.questions.push({q:q.q,open:true,auto:q.strict.length>0,answers:q.strict.length?q.strict:q.answers});
    }else{
      const ok=q.options.filter(o=>o.ok).length;
      if(q.options.length<2||ok!==1)errors.push(title+'potřebuje aspoň 2 odpovědi a právě jednu správnou (+), nebo odpovědi zapsané přes „=“ či „==“.');
      else t.questions.push({q:q.q,options:q.options.map(o=>o.t),answer:q.options.findIndex(o=>o.ok)});
    }
    q=null};
  for(const raw of txt.split(/\r?\n/)){
    const l=raw.trim();
    if(!l||l.startsWith('//'))continue;
    if(l.startsWith('# ')){closeQ();t={title:l.slice(2).trim(),questions:[]};tests.push(t)}
    else if(l.startsWith('? ')){closeQ();if(!t){errors.push('Otázka „'+l.slice(2)+'“ je před názvem testu (# ...).');continue}q={q:l.slice(2).trim(),options:[],answers:[],strict:[]}}
    else if((l[0]==='+'||l[0]==='-')&&q)q.options.push({t:l.slice(1).trim(),ok:l[0]==='+'});
    else if(l.startsWith('==')&&q){const a=l.slice(2).trim();if(a)q.strict.push(a)}
    else if(l[0]==='='&&q){const a=l.slice(1).trim();if(a)q.answers.push(a)}
  }
  closeQ();
  return {tests:tests.filter(x=>x.questions.length),errors};
}

function home(){
  cur=data=run=null;
  $('.sub').textContent='Vyber předmět.';
  $('#view').innerHTML='<div class="grid">'+SUBJECTS.map(s=>`<button class="tile" data-s="${s[0]}"><span>${s[2]}</span>${s[1]}</button>`).join('')+'</div>';
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>openSubject(b.dataset.s));
}

async function getText(url){
  try{const r=await fetch(url+'?v='+Date.now());return r.ok?await r.text():null}catch(e){return null}
}

// Seznam souborů ve složce materialy/ se bere z GitHub API (jedním dotazem), protože web sám složky vypsat neumí.
let treeCache=null;
async function getTree(){
  if(treeCache)return treeCache;
  try{const c=JSON.parse(sessionStorage.getItem('gh-tree')||'null');if(c&&Date.now()-c.t<300000)return treeCache=c.paths}catch(e){}
  let o=GH.owner,r=GH.repo;
  if(!o){
    const h=location.hostname;
    if(!h.endsWith('.github.io'))throw new Error('config');
    o=h.split('.')[0];
    const seg=location.pathname.split('/')[1];
    r=(seg&&!seg.includes('.'))?seg:h;
  }
  for(const b of (GH.branch?[GH.branch]:['main','master'])){
    const res=await fetch(`https://api.github.com/repos/${o}/${r}/git/trees/${encodeURIComponent(b)}?recursive=1`);
    if(res.status===403||res.status===429)throw new Error('limit');
    if(!res.ok)continue;
    const j=await res.json();
    const paths=j.tree.filter(x=>x.type==='blob'&&x.path.startsWith('materialy/')).map(x=>x.path);
    try{sessionStorage.setItem('gh-tree',JSON.stringify({t:Date.now(),paths}))}catch(e){}
    return treeCache=paths;
  }
  throw new Error('notfound');
}

const natural=(a,b)=>a.localeCompare(b,'cs',{numeric:true});
// "01 Zlomky" se zobrazí jako "Zlomky" (číslo slouží jen k seřazení)
const pretty=n=>n.replace(/^\d+[\s._-]+/,'')||n;

function buildMats(paths,slug){
  const topics=new Map();
  for(const p of paths){
    const parts=p.split('/');            // materialy / predmet / tema / soubor
    if(parts.length!==4||parts[1]!==slug||!IMG.test(parts[3]))continue;
    if(!topics.has(parts[2]))topics.set(parts[2],[]);
    topics.get(parts[2]).push(parts[3]);
  }
  return [...topics.keys()].sort(natural).map(t=>({
    title:pretty(t),
    items:topics.get(t).sort(natural).map(f=>({src:['materialy',slug,t,f].map(encodeURIComponent).join('/'),cap:''}))
  }));
}

async function ensureMats(){
  if(data.mats)return;
  $('#view').innerHTML='<p class="mu">Načítám…</p>';
  try{data.mats=buildMats(await getTree(),cur[0])}
  catch(e){
    data.mats=[];
    data.matsErr=e.message==='limit'?'GitHub dočasně omezil počet dotazů, zkus to za chvíli.'
      :e.message==='config'?'Nepodařilo se zjistit repozitář. Vyplň GH.owner a GH.repo nahoře ve skriptu.'
      :'Materiály se nepodařilo načíst.';
  }
}

async function openSubject(slug){
  cur=SUBJECTS.find(s=>s[0]===slug);
  tab='tests';topic=null;
  $('.sub').textContent=cur[1];
  $('#view').innerHTML='<p class="mu">Načítám…</p>';
  const tt=await getText('testy/'+slug+'.txt');
  data=tt?parse(tt):{tests:[],errors:[]};
  list();
}

function lightbox(items,k){
  const o=document.createElement('div');o.className='lb';
  const show=()=>{const it=items[k];
    o.innerHTML=`<button class="lbx" data-a="x">✕</button><div class="lbm"><img src="${esc(it.src)}" alt="${esc(it.cap)}"></div>`+
    `<div class="lbc">${it.cap?esc(it.cap)+' ':''}<span class="mu">(${k+1}/${items.length})</span> <a href="${esc(it.src)}" target="_blank" rel="noopener">plná velikost</a></div>`+
    (items.length>1?'<button class="lbp" data-a="p">‹</button><button class="lbn" data-a="n">›</button>':'')};
  const close=()=>{o.remove();document.removeEventListener('keydown',key)};
  const go=d=>{k=(k+d+items.length)%items.length;show()};
  const key=e=>{if(e.key==='Escape')close();else if(e.key==='ArrowLeft')go(-1);else if(e.key==='ArrowRight')go(1)};
  o.onclick=e=>{const a=e.target.dataset.a;
    if(a==='x'||e.target===o||e.target.classList.contains('lbm'))close();
    else if(a==='p')go(-1);else if(a==='n')go(1)};
  document.addEventListener('keydown',key);
  show();document.body.appendChild(o);
}

function newRun(t){return {t,i:0,score:0,picked:null,typed:'',ok:false,revealed:false}}

function list(){
  run=null;
  const inTopic=tab==='mats'&&topic!==null;
  const tabs=`<div class="tabs"><button data-tab="tests" class="${tab==='tests'?'on':''}">Cvičení</button><button data-tab="mats" class="${tab==='mats'?'on':''}">Materiály</button></div>`;
  let body;
  if(tab==='tests'){
    body=(data.tests.length?data.tests.map((t,i)=>`<div class="card row"><div><strong>${esc(t.title)}</strong><div class="mu">${t.questions.length} otázek</div></div><button class="pri" data-i="${i}">Spustit</button></div>`).join(''):'<p class="mu">Zatím tu nejsou žádné testy.</p>')+
      data.errors.map(e=>'<p class="err">'+esc(e)+'</p>').join('');
  }else if(!inTopic){
    body=data.mats.length?data.mats.map((t,i)=>`<div class="card row"><div><strong>${esc(t.title)}</strong><div class="mu">${t.items.length} ${t.items.length===1?'obrázek':t.items.length<5?'obrázky':'obrázků'}</div></div><button class="pri" data-t="${i}">Otevřít</button></div>`).join(''):'<p class="mu">Zatím tu nejsou žádné materiály.</p>'+(data.matsErr?'<p class="err">'+esc(data.matsErr)+'</p>':'');
  }else{
    const t=data.mats[topic];
    body=`<h3>${esc(t.title)}</h3><div class="gal">`+t.items.map((it,k)=>`<button class="th" data-g="${k}"><img src="${esc(it.src)}" alt="${esc(it.cap)}" loading="lazy">${it.cap?'<span>'+esc(it.cap)+'</span>':''}</button>`).join('')+'</div>';
  }
  $('#view').innerHTML=`<button id="back">← ${inTopic?'Témata':'Předměty'}</button><h2>${esc(cur[2]+' '+cur[1])}</h2>${tabs}${body}`;
  $('#back').onclick=()=>{if(inTopic){topic=null;list()}else home()};
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{tab=b.dataset.tab;topic=null;if(tab==='mats')await ensureMats();list()});
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{run=newRun(data.tests[+b.dataset.i]);quiz()});
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{topic=+b.dataset.t;list()});
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>lightbox(data.mats[topic].items,+b.dataset.g));
}

function quiz(){
  const v=$('#view'),{t,i}=run;
  if(i>=t.questions.length){
    v.innerHTML=`<div class="card"><h2>Hotovo</h2><p>Skóre: <strong>${run.score} / ${t.questions.length}</strong> (${Math.round(run.score/t.questions.length*100)} %)</p><button class="pri" id="again">Znovu</button> <button id="back">Zpět na testy</button></div>`;
    $('#again').onclick=()=>{run=newRun(t);quiz()};
    $('#back').onclick=list;return;
  }
  const q=t.questions[i];
  const done=run.picked!==null;
  let body;
  if(q.open){
    const cls=done?(run.ok?' ok':' bad'):'';
    const list=q.answers.map(x=>'<strong>'+esc(x)+'</strong>').join(' <span class="mu">/</span> ');
    const input=`<input class="txt${cls}" id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tvoje odpověď" value="${esc(run.typed)}" ${(done||run.revealed)?'disabled':''}>`;
    const answersBox=`<p class="res">Správná odpověď${q.answers.length>1?'i':''}: ${list}</p>`;
    if(q.auto){
      body=input+(done
        ?(run.ok?'<p class="res ok">Správně.</p>':'<p class="res bad">Špatně.</p>'+answersBox)+'<button class="pri" id="next">Další</button>'
        :'<button class="pri" id="check">Zkontrolovat</button>');
    }else{
      if(done)body=input+answersBox+(run.ok?'<p class="res ok">Označeno jako správně.</p>':'<p class="res bad">Označeno jako špatně.</p>')+'<button class="pri" id="next">Další</button>';
      else if(run.revealed)body=input+answersBox+'<p class="mu">Měl jsi to správně?</p><button class="pri" id="right">✓ Správně</button> <button id="wrong">✗ Špatně</button>';
      else body=input+'<button class="pri" id="reveal">Zobrazit správnou odpověď</button>';
    }
  }else{
    body=q.options.map((o,k)=>{let c='';if(done){if(k===q.answer)c=' ok';else if(k===run.picked)c=' bad'}
      return `<button class="opt${c}" data-k="${k}" ${done?'disabled':''}>${esc(o)}</button>`}).join('')+
      (done?'<button class="pri" id="next">Další</button>':'');
  }
  v.innerHTML=`<button id="back">← Cvičení</button><h2>${esc(t.title)}</h2><div class="bar"><div style="width:${i/t.questions.length*100}%"></div></div>
  <div class="card"><p class="mu">Otázka ${i+1} z ${t.questions.length}${q.open?' · napiš odpověď':''}</p><p><strong>${esc(q.q)}</strong></p>${body}</div>`;
  $('#back').onclick=list;

  if(q.open&&!done){
    const inp=$('#ans');
    if(q.auto){
      const check=()=>{
        const val=inp.value;
        if(!val.trim())return;
        run.typed=val;
        run.ok=q.answers.some(a=>norm(a)===norm(val));
        run.picked=true;
        if(run.ok)run.score++;
        quiz();
      };
      $('#check').onclick=check;
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
      inp.focus();
    }else if(!run.revealed){
      const reveal=()=>{run.typed=inp.value;run.revealed=true;quiz()};
      $('#reveal').onclick=reveal;
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')reveal()});
      inp.focus();
    }else{
      const judge=ok=>{run.ok=ok;run.picked=true;if(ok)run.score++;quiz()};
      $('#right').onclick=()=>judge(true);
      $('#wrong').onclick=()=>judge(false);
    }
  }else if(!q.open){
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;run.picked=k;if(k===q.answer)run.score++;quiz()});
  }
  const n=$('#next');if(n){n.onclick=()=>{run.i++;run.picked=null;run.typed='';run.ok=false;run.revealed=false;quiz()};n.focus()}
}
home();
</script>
</body>
</html>
