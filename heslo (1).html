<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generátor hesla</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px}
input{width:100%;font:inherit;padding:10px;margin:6px 0 12px;box-sizing:border-box}
code{display:block;word-break:break-all;padding:10px;background:#eee;color:#111;border-radius:6px;margin:8px 0}
button{font:inherit;padding:8px 14px}</style></head>
<body>
<h1>Generátor hesla</h1>
<p>Napiš nové heslo. Výsledný kód vlož do <code style="display:inline;padding:2px 6px">index.html</code> místo hodnoty u <code style="display:inline;padding:2px 6px">PASS_HASH</code>.</p>
<input id="p" type="text" placeholder="Nové heslo">
<button id="b">Vytvořit kód</button>
<code id="o">…</code>
<button id="c">Kopírovat</button>
<script>
const SALT='testy-v1:';
document.getElementById('b').onclick=async()=>{
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(SALT+document.getElementById('p').value));
  document.getElementById('o').textContent=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
};
document.getElementById('c').onclick=()=>navigator.clipboard.writeText(document.getElementById('o').textContent);
</script></body></html>
